name: Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build_and_analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Build currency-notifier
        run: cd services/currency-notifier && go build -v ./...

      - name: Analyze currency-notifier
        uses: golangci/golangci-lint-action@v6.0.1
        with:
          working-directory: services/currency-notifier

      - name: Build notification-service
        run: cd services/notification-service && go build -v ./...

      - name: Analyze notification-service
        uses: golangci/golangci-lint-action@v6.0.1
        with:
          working-directory: services/notification-service