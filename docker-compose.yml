services:
  db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: currency_notifier
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d currency_notifier" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: username
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmqctl status" ]
      interval: 2s
      timeout: 10s
      retries: 10

  currency-notifier:
    build:
      context: currency-notifier
      dockerfile: Dockerfile
    restart: always
    env_file:
      - services/currency-notifier/.env-local
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: notification-service
      dockerfile: Dockerfile
    restart: always
    env_file:
      - services/notification-service/.env-prod
    depends_on:
      rabbitmq:
        condition: service_healthy


volumes:
  db_data: