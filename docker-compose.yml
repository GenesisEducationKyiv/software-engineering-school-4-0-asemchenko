services:
  currency_notifier_db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: currency_notifier
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d currency_notifier" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - currency_notifier_db_data:/var/lib/postgresql/data

  notification_service_db:
    image: postgres:16
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: notification_service
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d notification_service" ]
      interval: 2s
      timeout: 10s
      retries: 10
    volumes:
      - notification_service_db_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: username
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmqctl status" ]
      interval: 2s
      timeout: 10s
      retries: 10

  currency-notifier:
    build:
      context: services/currency-notifier
      dockerfile: Dockerfile
    restart: always
    env_file:
      - services/currency-notifier/.env-local
    ports:
      - "8080:8080"
    depends_on:
      currency_notifier_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: services/notification-service
      dockerfile: Dockerfile
    restart: always
    env_file:
      - services/notification-service/.env-local
    ports:
      - "8082:8082"
    depends_on:
      notification_service_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy


volumes:
  currency_notifier_db_data:
  notification_service_db_data: