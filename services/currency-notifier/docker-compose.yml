services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: currency_notifier
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d currency_notifier" ]
      interval: 2s
      timeout: 10s
      retries: 10
  wiremock:
    image: wiremock/wiremock:3.6.0
    volumes:
      - ./mocks/rate-provider:/home/wiremock
    ports:
      - "8282:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail http://localhost:8080/__admin/health || exit 1" ]
      interval: 2s
      timeout: 10s
      retries: 10
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: username
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmqctl status" ]
      interval: 2s
      timeout: 10s
      retries: 10