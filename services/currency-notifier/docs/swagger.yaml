basePath: /api
host: localhost:8080
info:
  contact: {}
  description: API for current USD-UAH exchange rate and for email-subscribing on
    the currency rate
  title: UAH currency application
  version: "1.0"
paths:
  /rate:
    get:
      description: Request returns the current USD to UAH exchange rate using Monobank
        API
      produces:
      - application/json
      responses:
        "200":
          description: Current USD to UAH exchange rate
          schema:
            type: number
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get the current USD to UAH exchange rate
      tags:
      - rate
  /subscribe:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Request adds a new email to receive USD to UAH exchange rate updates
      parameters:
      - description: TargetEmail address
        in: formData
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: TargetEmail added
          schema:
            type: string
        "409":
          description: Return if email already exists in the database
          schema:
            type: string
      summary: Subscribe to rate change notifications
      tags:
      - subscription
  /unsubscribe:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Request removes an email from receiving USD to UAH exchange rate
        updates
      parameters:
      - description: Subscriber User ID
        in: formData
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Subscription removed
          schema:
            type: string
      summary: Unsubscribe from rate change notifications
      tags:
      - subscription
swagger: "2.0"
